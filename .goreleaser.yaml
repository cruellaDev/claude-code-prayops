version: 2

project_name: prayops

builds:
  - id: prayops
    main: ./cmd/prayops
    binary: prayops
    env:
      - CGO_ENABLED=0
    # The bootstrap smoke test compares `prayops version --json` against the
    # runtime manifest, so the tag has to reach the binary.
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: "prayops_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
