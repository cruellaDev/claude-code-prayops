version: 2

project_name: prayops

builds:
  - id: prayops
    main: ./cmd/prayops
    binary: prayops
    env:
      - CGO_ENABLED=0
    # The bootstrap smoke test compares `prayops version --json` against the
    # runtime manifest, so the tag has to reach the binary.
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: "prayops_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # GoReleaser also adds the licence, readme and changelog by convention.
    # They are left in - the bootstrap extracts only the binary - so the
    # archive carries its own licence. `files: []` does not suppress them: an
    # empty list reads as unset, and the defaults apply anyway. That is what
    # shipped a v0.1.0 archive the installer refused.

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
