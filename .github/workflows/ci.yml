name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  # macOS and Linux are both P0 targets and they disagree on the tools the
  # bootstrap depends on - shasum vs sha256sum, BSD vs GNU tar - so the suite
  # runs on both rather than trusting one.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      # Covers the plugin structure, contracts, runtime, the bootstrap
      # installer against a local release server, and the privacy fixtures
      # that drive the real binary and read back everything it wrote.
      - run: go test ./...

      - run: go test -race ./...

  # The plugin ships its runtime, so those binaries are committed - and a
  # committed binary can quietly stop matching the source it claims to be.
  # The build is reproducible on purpose so this can compare byte for byte.
  shipped-runtime-is-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Rebuild and compare
        run: |
          set -eu
          ./scripts/build-plugin-runtime.sh "$RUNNER_TEMP/runtime"

          for target in darwin_arm64 darwin_amd64 linux_arm64 linux_amd64; do
            committed="plugins/prayops/runtime/$target/prayops"
            if ! cmp -s "$committed" "$RUNNER_TEMP/runtime/$target/prayops"; then
              echo "$committed does not match the source." >&2
              echo "Run ./scripts/build-plugin-runtime.sh and commit the result." >&2
              exit 1
            fi
            test -x "$committed" || { echo "$committed is not executable" >&2; exit 1; }
            echo "$target matches"
          done

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -ldflags "-s -w -X main.version=ci" -o /dev/null ./cmd/prayops

  # Proves the release archives and checksums.txt the bootstrap expects can
  # actually be produced, without publishing anything.
  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish

      # Checking the archive names alone once let a release ship that no
      # bootstrap could install: the archive carried a CHANGELOG the entry
      # allowlist refused. The contents are checked too now.
      - name: Archives match the runtime manifest and the bootstrap
        run: |
          set -eu
          template="$(sed -n 's/.*"assetTemplate"[[:space:]]*:[[:space:]]*"\(.*\)".*/\1/p' \
            plugins/prayops/runtime-manifest.json)"
          test -f dist/checksums.txt

          for target in darwin_arm64 darwin_amd64 linux_arm64 linux_amd64; do
            os="${target%_*}"
            arch="${target#*_}"
            expected="$(printf '%s' "$template" \
              | sed -e "s/{version}/*/" -e "s/{os}/$os/" -e "s/{arch}/$arch/")"

            # shellcheck disable=SC2086
            archive="$(ls dist/$expected)"
            echo "checking $archive"

            listing="$(tar -tzf "$archive")"
            case "$listing" in
              *prayops*) ;;
              *) echo "$archive has no prayops binary" >&2; exit 1 ;;
            esac

            # The bootstrap refuses anything that could land outside the
            # install directory, so a release carrying one is unusable.
            for entry in $listing; do
              case "$entry" in
                /* | *..* | */*)
                  echo "$archive contains '$entry', which the bootstrap refuses" >&2
                  exit 1
                  ;;
              esac
            done

            # Every entry has to be a regular file, same rule as the installer.
            if tar -tvzf "$archive" | grep -qv '^-'; then
              echo "$archive contains a link or directory entry" >&2
              exit 1
            fi
          done

      # The strongest check available: install from the archives just built,
      # using the shipped bootstrap, exactly as a user would.
      #
      # A snapshot binary reports `<version>-SNAPSHOT-<sha>`, and the installer
      # refuses a binary whose version does not match the manifest - correctly.
      # So the manifest handed to the bootstrap is a copy carrying the snapshot
      # version. Everything else is the real script and the real archive.
      - name: The bootstrap can install what GoReleaser produced
        run: |
          set -eu
          archive="$(ls dist/prayops_*_linux_amd64.tar.gz)"
          snapshot="$(basename "$archive" | sed -E 's/^prayops_(.+)_linux_amd64\.tar\.gz$/\1/')"
          echo "snapshot version: $snapshot"

          mkdir -p serve plugin-root/scripts plugin-root/.claude-plugin
          cp "$archive" serve/
          ( cd serve && sha256sum ./*.tar.gz | sed 's|\./||' > checksums.txt )

          cp plugins/prayops/scripts/setup.sh plugin-root/scripts/
          cp plugins/prayops/.claude-plugin/plugin.json plugin-root/.claude-plugin/
          sed "s/\"runtimeVersion\"[[:space:]]*:[[:space:]]*\"[^\"]*\"/\"runtimeVersion\": \"$snapshot\"/" \
            plugins/prayops/runtime-manifest.json > plugin-root/runtime-manifest.json

          ( cd serve && python3 -m http.server 8099 >/dev/null 2>&1 & echo $! > /tmp/serve.pid )
          sleep 2

          CLAUDE_PLUGIN_ROOT="$PWD/plugin-root" \
          CLAUDE_PLUGIN_DATA="$PWD/plugin-data" \
          PRAYOPS_RELEASE_BASE_URL="http://127.0.0.1:8099" \
            ./plugin-root/scripts/setup.sh --yes

          kill "$(cat /tmp/serve.pid)"

          # It runs, and nothing but the binary was extracted.
          ./plugin-data/bin/prayops version --json
          for name in LICENSE README.md CHANGELOG.md; do
            if [ -e "plugin-data/bin/$name" ] || [ -e "plugin-data/$name" ]; then
              echo "$name was extracted from the archive" >&2
              exit 1
            fi
          done
